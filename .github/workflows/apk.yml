name: DarkStream APK

on:
  push:
    branches: [darkstream]
  workflow_dispatch:

concurrency:
  group: darkstream-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  derle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: HTML arayüzü uygulamaya kopyala
        run: |
          rm -rf android/app/src/main/assets/web
          mkdir -p android/app/src/main/assets
          cp -r web android/app/src/main/assets/web

      - name: APK derle
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: APK'yı hazırla
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk DarkStream.apk
          ls -la DarkStream.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DarkStream.apk
          path: DarkStream.apk

      - name: Sürüm sayfasına yükle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete darkstream-apk --yes --cleanup-tag || true
          gh release create darkstream-apk DarkStream.apk \
            --title "DarkStream (son sürüm #${{ github.run_number }})" \
            --notes "HTML arayüzlü oynatıcı. Telefon ve Android TV için. İndir: DarkStream.apk → kur (bilinmeyen kaynaklara izin ver)." \
            --target "${{ github.sha }}" \
            --latest=false
