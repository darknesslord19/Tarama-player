name: APK Derle

on:
  push:
    branches: [main]
    paths:
      - 'tv.html'
      - 'android/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

concurrency:
  group: apk-derle
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  derle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Arayüzü uygulamaya kopyala
        run: |
          mkdir -p android/app/src/main/assets
          cp tv.html android/app/src/main/assets/index.html

      - name: APK derle
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: APK'yı hazırla
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk DarknesTv.apk
          ls -la DarknesTv.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DarknesTv.apk
          path: DarknesTv.apk

      - name: Sürüm sayfasına yükle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk DarknesTv.apk \
            --title "DarknesTv (son sürüm #${{ github.run_number }})" \
            --notes "Telefon ve Android TV için. İndir: DarknesTv.apk → kur (bilinmeyen kaynaklara izin ver)." \
            --target "${{ github.sha }}"
